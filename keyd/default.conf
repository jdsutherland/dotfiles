# Installed to /etc/keyd/default.conf by scripts/omarchy.sh (not symlinked —
# that directory is root-owned). Mirrors the mac Karabiner setup; see
# KEYBINDINGS.md.
#
# Panic sequence if a bad reload breaks input: backspace+escape+enter kills keyd.
#
# Right side is special, left side is vanilla: leftcontrol/leftalt are both
# untouched (plain ctrl/alt), so tmux M- / nvim / Ghostty alt+ binds and
# ordinary ctrl+key shortcuts are unaffected.

[ids]
*

[main]
# Hold = plain ctrl (generic — works for ctrl+anything). Tap = escape.
capslock = overload(control, esc)

# Hold = nav layer for word-nav/undo/redo + arrows (below). Tap = escape.
rightcontrol = overload(nav, esc)

# Hold = hyper (ctrl+super+alt+shift). Tap = escape.
rightalt = overload(hyper, esc)

# No explicit bindings: every hyper+<key> falls through to <key> chorded with
# all four modifiers, for Hyprland's bindings.lua to catch.
[hyper:C-M-A-S]

# Word-nav / delete-word / undo-redo, ported from Karabiner's
# ctrl-shift_vim-movements (p/n/i/o/u/y). Kept off ctrl+shift because those
# collide with Command Palette, DevTools Inspect, incognito windows, Firefox
# bookmarks, and Linux's own Ctrl+Shift+U unicode entry.
[nav:C]
p = A-left
n = A-right
i = A-backspace
o = A-delete
u = C-z
y = C-S-z

# Ctrl+Shift+hjkl -> arrows, system-wide (Karabiner's ctrl-shift_vim-movements).
# Defined twice: control+shift fires via capslock+shift or left_control+shift
# (both still on the shared control layer); nav+shift fires via
# right_control, which has its own layer (above) rather than the shared one.
[control+shift]
h = left
j = down
k = up
l = right
comma = backspace
dot = delete
semicolon = enter
leftbrace = pagedown
rightbrace = pageup

[nav+shift]
h = left
j = down
k = up
l = right
comma = backspace
dot = delete
semicolon = enter
leftbrace = pagedown
rightbrace = pageup
