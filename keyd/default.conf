# Installed to /etc/keyd/default.conf by scripts/omarchy.sh (not symlinked —
# that directory is root-owned). Mirrors the mac Karabiner setup; see
# KEYBINDINGS.md.
#
# Panic sequence if a bad reload breaks input: backspace+escape+enter kills keyd.

[ids]
*

[main]
# Hold = plain ctrl (generic — works for ctrl+anything). Tap = escape.
capslock = overload(control, esc)

# Hold = its own layer for word-nav/undo/redo (below). Tap = escape (same as
# capslock/rightcontrol below — a self-referential tap action here triggers
# a keyd checker warning, so esc it is). Plain ctrl (ctrl+anything not
# overridden below) still works via capslock; rightcontrol is now dedicated
# to hyper (below).
leftcontrol = overload(nav, esc)

# Hold = hyper (ctrl+super+alt+shift). Tap = escape. leftalt/rightalt are
# both untouched — still plain alt, so tmux M- / nvim / Ghostty alt+ binds
# are unaffected.
rightcontrol = overload(hyper, esc)

# No explicit bindings: every hyper+<key> falls through to <key> chorded with
# all four modifiers, for Hyprland's bindings.lua to catch.
[hyper:C-M-A-S]

# Word-nav / delete-word / undo-redo, ported from Karabiner's
# ctrl-shift_vim-movements (p/n/i/o/u/y). Kept off ctrl+shift because those
# collide with Command Palette, DevTools Inspect, incognito windows, Firefox
# bookmarks, and Linux's own Ctrl+Shift+U unicode entry.
[nav:C]
p = A-left
n = A-right
i = A-backspace
o = A-delete
u = C-z
y = C-S-z

# Ctrl+Shift+hjkl -> arrows, system-wide (Karabiner's ctrl-shift_vim-movements).
# Defined twice: control+shift fires via capslock+shift (the only key still
# on the shared control layer); nav+shift fires via left_control, which has
# its own layer (above) rather than the shared one.
[control+shift]
h = left
j = down
k = up
l = right
comma = backspace
dot = delete
semicolon = enter
leftbrace = pagedown
rightbrace = pageup

[nav+shift]
h = left
j = down
k = up
l = right
comma = backspace
dot = delete
semicolon = enter
leftbrace = pagedown
rightbrace = pageup
