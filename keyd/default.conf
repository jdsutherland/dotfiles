# Installed to /etc/keyd/default.conf by scripts/omarchy.sh (not symlinked —
# that directory is root-owned). Mirrors the mac Karabiner setup; see
# KEYBINDINGS.md.
#
# Panic sequence if a bad reload breaks input: backspace+escape+enter kills keyd.
#
# leftcontrol is untouched (plain ctrl). capslock is remapped below.
# leftalt/leftmeta are swapped so physical key position matches mac: the
# innermost key next to Space sends Super (matching Omarchy's SUPER-based
# defaults to mac's Cmd position), and the next key out sends Alt (matching
# mac's Option position, and tmux M- / Ghostty alt+ / nvim Alt binds).
# rightalt/rightcontrol are also swapped: hyper moves to rightalt, and
# rightcontrol takes over rightalt's old stock AltGr role. Less confident
# about this half -- easy to revert if it doesn't feel right.

[ids]
*

[main]
# Swap leftalt/leftmeta so physical position matches mac (innermost key
# next to Space = Super, matching Cmd; next key out = Alt, matching
# Option). Explicit layer() actions rather than [aliases] -- aliasing
# didn't take effect when tested.
# Super tap = SUPER+ALT+F (full width); Ghostty overrides the tap to M-z
# (tmux zoom) via ~/.config/keyd/app.conf.
leftalt = overload(meta, macro(M-A-f))
leftmeta = layer(alt)

# Hold = plain ctrl (generic — works for ctrl+anything, from either
# physical ctrl key). Tap = escape.
capslock = overload(control, esc)

# Hold = hyper (ctrl+super+alt+shift). Tap = SUPER+CTRL+TAB (Hyprland's
# "Former workspace") -- back-and-forth toggle to the previously focused
# workspace.
rightalt = overload(hyper, macro(M-C-tab))

# Vim navigation layer. Was layer(altgr), which does nothing on a US layout,
# so the key was free. Held, hjkl become arrows -- two keys and one modifier
# instead of the three-key [control+shift] chord below.
#
# Deliberately NOT the capslock+space swap() from keyd's
# capslock-escape-with-vim-mode.conf example: capslock+space is C-space, which
# is the tmux prefix, and renaming capslock's layer would orphan the
# [control+shift] composite layer (composites match on layer *name*, so it
# would have to become [ctrl_vim+shift]).
#
# Runs alongside [control+shift], which is untouched -- different trigger, no
# overlap -- so both can be tried before picking one.
rightcontrol = layer(nav)

# No explicit bindings: every hyper+<key> falls through to <key> chorded with
# all four modifiers, for Hyprland's bindings.lua to catch.
[hyper:C-M-A-S]

# Full port of Karabiner's ctrl-shift_vim-movements. Known conflicts accepted
# for now (VS Code/Electron Command Palette on P, browser DevTools Inspect on
# I, Chrome incognito/Nautilus new-folder on N, Firefox bookmarks on O, Chrome
# console on J, Firefox console on K, Linux's own unicode entry on U) —
# revisit if any of these turn out to matter in practice.
[control+shift]
h = left
j = down
k = up
l = right
p = macro(C-left)
n = macro(C-right)
i = macro(C-backspace)
o = macro(C-delete)
u = macro(C-z)
y = macro(C-S-z)
comma = backspace
dot = delete
semicolon = home
apostrophe = end
leftbrace = pagedown
rightbrace = pageup

# Clipboard history, matching the mac Karabiner bind for the same feature.
equal = macro(M-C-v)

# Same bindings as [control+shift] above, so the two can be compared directly.
# Unbound keys fall through as themselves (bare layer, no modifier attached).
[nav]
h = left
j = down
k = up
l = right
p = macro(C-left)
n = macro(C-right)
i = macro(C-backspace)
o = macro(C-delete)
u = macro(C-z)
y = macro(C-S-z)
comma = backspace
dot = delete
semicolon = home
apostrophe = end
leftbrace = pagedown
rightbrace = pageup
equal = macro(M-C-v)
