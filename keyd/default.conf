# Installed to /etc/keyd/default.conf by scripts/omarchy.sh (not symlinked —
# that directory is root-owned). Mirrors the mac Karabiner setup; see
# KEYBINDINGS.md.
#
# Panic sequence if a bad reload breaks input: backspace+escape+enter kills keyd.

[ids]
*

[main]
# Hold = hyper layer (ctrl+super+alt+shift). Tap = escape.
capslock = overload(hyper, esc)

# No explicit bindings: every hyper+<key> falls through to <key> chorded with
# all four modifiers, for Hyprland's bindings.lua to catch.
[hyper:C-M-A-S]

# Ctrl+Shift+hjkl -> arrows, system-wide (Karabiner's ctrl-shift_vim-movements).
[control+shift]
h = left
j = down
k = up
l = right
