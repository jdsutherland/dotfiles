# Omarchy ships a default tmux config to ~/.config/tmux/tmux.conf, and tmux
# loads this XDG path *after* ~/.tmux.conf, letting Omarchy's defaults override
# this repo's tmux.conf. rcm installs this file in place of the Omarchy default
# so tmux defers back to the repo's ~/.tmux.conf.
#
# This is a source-file shim (rather than empty) so that tpm — whose installer
# reads the XDG config in preference to ~/.tmux.conf — still finds the @plugin
# declarations by following this source-file into ~/.tmux.conf.
#
# If `omarchy refresh tmux` (or an upgrade) rewrites this path with the Omarchy
# default again, restore the override with:
#   rcup -f config/tmux/tmux.conf
source-file ~/.tmux.conf
