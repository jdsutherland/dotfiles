# Applied by keyd-application-mapper as an overlay on top of /etc/keyd/*.conf
# whenever a matching window is focused (cleared on focus-out). See
# keyd-application-mapper(1) and KEYBINDINGS.md.
#
# control.X here means "the control layer + X" -- fires from left_control or
# capslock-held, same as everywhere else. right_control stays hyper-only.

[com-mitchellh-ghostty]
# Super tap in Ghostty = tmux zoom (Alt+z -> M-z resize-pane -Z). Matches
# mac's left_cmd tap -> Opt+Tab (M-Tab zoom); Alt+Tab itself is claimed by
# Hyprland's window-cycle bind, hence M-z.
leftalt = overload(meta, macro(A-z))

[google-chrome]

control.h = A-left
control.j = C-S-tab
control.k = C-tab
control.l = A-right
control.d = C-w
