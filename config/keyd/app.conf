# Applied by keyd-application-mapper as an overlay on top of /etc/keyd/*.conf
# whenever a matching window is focused (cleared on focus-out). See
# keyd-application-mapper(1) and KEYBINDINGS.md.
#
# control.X here means "the control layer + X" -- fires from left_control or
# capslock-held, same as everywhere else. right_control stays hyper-only.

[com-mitchellh-ghostty]
# Super tap in Ghostty = tmux zoom (Alt+z -> M-z resize-pane -Z). Matches
# mac's left_cmd tap -> Opt+Tab (M-Tab zoom); Alt+Tab itself is claimed by
# Hyprland's window-cycle bind, hence M-z.
leftalt = overload(meta, macro(A-z))

# Chrome — regular windows plus webapps (class matches *chrome*).
[*chrome*]

control.h = A-left
control.j = C-S-tab
control.k = C-tab
control.l = A-right
control.d = C-w

# mac parity: Super+A/F/G -> select-all / find / find-next, Super+N ->
# incognito (Chrome only, via the meta layer since leftalt is remapped to
# Super; Ctrl+Shift+N is taken by the global word-forward bind).
meta.a = C-a
meta.f = C-f
meta.g = C-g
meta.n = C-S-n

# Discord (a Chrome webapp here, class also matches *chrome* above --
# keyd-application-mapper merges bindings from every matching section
# rather than picking one, per lookup_bindings() in the script itself, so
# this layers on top rather than replacing it. Placed after [*chrome*] so
# these win where both bind the same key -- j/k below overrides Chrome's
# tab-switching, meaningless in a single-tab webapp anyway).
#
# Ported from config/karabiner/assets/complex_modifications/discord.json.
# Discord's own shortcuts are the same mac-Cmd<->Linux-Ctrl,
# mac-Option<->Linux-Alt swap as its "Ctrl+/ vs Cmd+/" shortcuts-list
# binding, so these should be right, but this is inferred from that
# convention and the mac side's own mnemonics (n/p next-prev, j/k vim-ish,
# m for mentions), not confirmed against a running Discord -- worth a
# real check once tried.
[*discord*]

# Navigate channels up/down within the current server.
control.n = A-down
control.p = A-up
# Navigate servers up/down in the server list.
control.apostrophe = C-A-up
control.semicolon = C-A-down
# Jump to next/previous unread channel.
control.j = A-S-down
control.k = A-S-up
# Jump to next mention.
control.m = C-A-S-down
# Back/forward through Discord's own view history. h/l above (inherited
# from [*chrome*]) may already cover this via browser-level history --
# these are Discord's own shortcut for it, kept as a second path in case
# the two don't turn out to be equivalent.
control.o = C-leftbrace
control.i = C-rightbrace
