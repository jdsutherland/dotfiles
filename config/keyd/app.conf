# Applied by keyd-application-mapper as an overlay on top of /etc/keyd/*.conf
# whenever a matching window is focused (cleared on focus-out). See
# keyd-application-mapper(1) and KEYBINDINGS.md.
#
# control.X here means "the control layer + X" -- fires from left_control or
# capslock-held, same as everywhere else. right_control stays hyper-only.

[com-mitchellh-ghostty]
# Super tap in Ghostty = tmux zoom (Alt+z -> M-z resize-pane -Z). Matches
# mac's left_cmd tap -> Opt+Tab (M-Tab zoom); Alt+Tab itself is claimed by
# Hyprland's window-cycle bind, hence M-z.
leftalt = overload(meta, macro(A-z))

# Chrome — regular windows plus webapps (class matches *chrome*).
[*chrome*]

control.h = A-left
control.j = C-S-tab
control.k = C-tab
control.l = A-right
control.d = C-w

meta.n = C-S-n

# Regular Chrome windows: CLUT (Cycle Last Used Tabs) owns Alt+W on Linux.
# Translate Ctrl+W before Chrome can consume it as Close Tab. Keep this exact
# class match separate so Chrome app-mode windows are unaffected.
[google-chrome]
control.w = A-w

# AI webapps. Both sites natively use Ctrl+Shift+O for a new chat, but the
# global [control+shift] Vim layer maps that chord to Ctrl+Delete. Give them
# the conventional Ctrl+N instead; placing these after [*chrome*] also keeps
# Chrome's New Window shortcut from taking it first.
[*chatgpt*]
control.n = C-S-o
# Restore ChatGPT's native Search chats shortcut; [*chrome*] otherwise turns
# Ctrl+K into next-tab, which is useless in a single-window webapp.
control.k = C-k

[*gemini*]
control.n = C-S-o
# Let the AI Webapp Shortcuts content script receive Ctrl+K and activate
# Gemini's Search chats control instead of focusing the composer.
control.k = C-k

# Vesktop. Its native Ctrl+number shortcuts pass through untouched; this
# overlay adds the Vim-style navigation ported from the mac Discord rules in
# config/karabiner/assets/complex_modifications/discord.json. Unlike the old
# Chrome webapp, Vesktop does not also match [*chrome*], so back/forward is
# defined explicitly below.
[vesktop]

# Navigate channels up/down within the current server.
control.n = A-down
control.p = A-up
# Navigate servers up/down in the server list.
control.apostrophe = C-A-up
control.semicolon = C-A-down
# Jump to next/previous unread channel.
control.j = A-S-down
control.k = A-S-up
# Jump to next mention.
control.m = C-A-S-down
# Back/forward. Keep both h/l and o/i aliases now that Vesktop no longer
# inherits Chrome's application overlay.
control.h = A-left
control.l = A-right
control.o = A-left
control.i = A-right
