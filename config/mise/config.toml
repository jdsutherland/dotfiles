# mise global config — applies in every directory (unlike a bare
# .tool-versions file, which mise only discovers by walking up from the
# current directory, so it silently no-ops anywhere outside $HOME, e.g. /tmp).
# See: https://mise.jdx.dev/configuration.html

[tools]
bun = "1.4"
go = "1.27"
python = "3.14"
rust = "1.98"
ruby = "4.0"
"npm:typescript" = "7"
claude = "latest"
hunk = "latest"
node = "26"
pi = "latest"
gh = "latest"
codex = "latest"
yt-dlp = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:nicknisi/fleet" = "latest"
"github:nicknisi/sessions" = "latest"

[settings.upgrade]
auto_prune = false
