unbind-key C-b
set -g prefix C-space
bind -N "Send prefix" -r C-space send-prefix

# Set {{{
set -g default-command "$SHELL"
set -g default-terminal tmux-256color
set -as terminal-features ",xterm-ghostty:RGB,ghostty:RGB"
# lets Kitty Graphics Protocol escapes (used by snacks.image) reach Ghostty
set -g allow-passthrough on
set -s set-clipboard external
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -s escape-time 0
set -g display-time 4000
set -g display-panes-time 2000
set -g history-limit 500000
set -g mouse on
# Killing a session switches to another instead of detaching the client
# (yanked from omarchy's default config).
set -g detach-on-destroy off
# Size windows to the smallest client actually *looking* at them, rather than
# the smallest attached to the session.
setw -g aggressive-resize on
set -g status-keys vi
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
# }}}

# Styles — Kanagawa Dragon {{{
# Pane backgrounds
setw -g window-active-style bg="#181616"
setw -g window-style bg="#12120f"

# Pane borders
set -g pane-border-style "fg=#282727"
set -g pane-active-border-style "fg=#8ba4b0"

# command mode
set -g message-style 'bg=#282727,fg=#8ba4b0'

# Status bar
set -g status-style bg=#181616,fg=#c5c9c5
set -g status-interval 5
set -g status-right-length 350
set -g status-left "#[fg=#181616,bg=#8ba4b0,bold] #S "
set -g status-right "#[fg=#c5c9c5]%a, %b %d - %I:%M "
set -g window-status-current-format "#[fg=#c5c9c5,bg=#282727,nobold,noitalics,nounderscore] #I:#W#F "
set -g window-status-format "#[fg=#7a8382,bg=#12120f,nobold,noitalics,nounderscore] #I:#W#F "
# }}}

# NOTE: every binding below carries a -N description. That is what makes
# prefix+? (and `tmux list-keys -N`) readable -- without notes the cheatsheet
# just echoes raw tmux commands back at you.

# Copy mode {{{
# Use vim keybindings in copy mode
setw -g mode-keys vi
bind -N "Enter copy mode" -n M-i copy-mode
bind-key -N "Begin selection" -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -N "Copy selection to clipboard" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sed 's/[[:blank:]█]*$//' | clip"
bind-key -N "Copy selection to clipboard" -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "sed 's/[[:blank:]█]*$//' | clip"
bind-key -N "Copy whole line to clipboard" -T copy-mode-vi Y send-keys -X copy-pipe-line-and-cancel "sed 's/[[:blank:]█]*$//' | clip"
unbind -T copy-mode-vi Space
bind -N "Repeat last jump" -T copy-mode-vi Space send -X jump-again
bind-key -N "Jump to first non-blank" -T copy-mode-vi 0 send -X back-to-indentation
bind-key -N "Jump to end of line" -T copy-mode-vi 4 send -X end-of-line
bind -N "Copy mode at previous prompt" Escape copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward "❯"

# Default to incremental search in copy-mode
# TODO: ensure / search up by default
bind-key -N "Search backward (incremental)" -T copy-mode-vi / command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -N "Search forward (incremental)" -T copy-mode-vi ? command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -N "Copy mode, search backward" / copy-mode\; command-prompt -i -p "search up" "send -X search-backward-incremental "%%%""
# }}}

# fzf long words to clipboard (runs in a small popup capturing current pane)
bind-key -N "Fzf long words in pane -> clipboard" s display-popup -w 50% -h 60% -E "tmux capture-pane -t '#{pane_id}' -p | sed '/^$/d' | tr ' ' '\n' | awk 'length>10' | sort | uniq | fzf --reverse | clip"

# Open split (kept as splits for side-by-side editing reference)
bind -N "Split: todo.md" t splitw -h -c ~/notes/ "$EDITOR todo.md"
bind -N "Split: today's daily note" a splitw -h -c ~/notes/daily "$EDITOR $(date '+%m-%d-%y_%a').md"
bind -N "Split: today's ~/Daily note" j splitw -h -c ~/Daily/ "$EDITOR $(date '+%m-%d-%y_%a').md"
bind -N "Split: today's TIL note" T splitw -h -c ~/til/ "$EDITOR $(date '+%m-%d-%y_%a').md"

# Interactive pickers & quick actions (migrated to floating popups)
# NOTE: this `w` is shadowed by the swap-window binding further down -- both
# use prefix+w and the later one wins.
bind -N "Popup: wiki file picker" w display-popup -d ~/wiki -w 85% -h 85% -E "nvim -c 'Telescope find_files'"
bind -N "Split: dotfiles file picker" C-d split-window -h -c ~/.dotfiles/ "nvim --cmd 'lua vim.g.no_session_restore = true' -c 'Telescope find_files'"
bind -N "Popup: rcup (re-link dotfiles)" R display-popup -d ~/ -w 60% -h 40% -E "rcup; echo 'Done. Press enter to close.'; read"
bind -N "Split: man page" m command-prompt -p man: "splitw -h 'man %1'"
# run command
bind -N "Split: run a zsh command" -n M-h command-prompt -p 'zsh:' "splitw -l 30% -h -c \"#{pane_current_path}\" 'source ~/.zsh/configs/functions.zsh; source ~/.zsh/configs/aliases.zsh; %1 ; read'"
bind -N "Split: batgrep search" -n M-g command-prompt -p 'batgrep:' "splitw -l 30% -h -c \"#{pane_current_path}\" 'batgrep --smart-case --search-pattern %1'"
bind -N "Lazygit" g run-shell "tmux-lazygit"
bind -N "Popup: gfzf (git browser)" C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "gfzf"
# Create a new session from fuzzy project list inside a popup
bind -N "Popup: new session from project list" C-t display-popup -w 60% -h 60% -E "zsh -c 'source ~/.zsh/configs/navigation.zsh && tm-select-session'"
# Dismiss current pane to background window
bind -N "Break pane into background window" b break-pane -d
bind -N "Attach to project session (tat)" C-b send-keys 'tat && exit' Enter
# kill current session and switch another session, keeping connected to tmux throughout.
bind-key -N "Kill session, stay attached" ! run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'
bind-key -N "Join pane from another window" J command-prompt -p "join pane from: "  "join-pane -h -s '%%'"
# Make C-j display a selectable list of sessions inside a popup (sorted by activity)
bind -N "Popup: switch session (by activity)" C-j display-popup -w 60% -h 60% -E "tmux list-sessions -F '#{session_activity}:#{session_name}' | sort -nr | cut -d ':' -f 2 | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# # zoom vim window & tmux
bind -N "Zoom pane (and vim window)" -n M-q if-shell "$is_vim" "send-keys ';ZoomWinTabToggle' Enter" \; resize-pane -Z

# Easy reloading of the tmux.conf configuration file
bind-key -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Searchable keybinding cheatsheet on prefix+? (prefix table; the ? in
# copy-mode-vi above is a different table and is unaffected). Omarchy ships
# omarchy-menu-tmux-keybindings, which spins up a throwaway tmux server,
# sources this config and pretty-prints every binding; fall back to plain
# list-keys on macOS where that script does not exist.
if-shell "command -v omarchy-menu-tmux-keybindings >/dev/null 2>&1" \
  "bind-key -N 'Show tmux keybindings' ? display-popup -E -w 80% -h 70% -T ' Tmux keybindings ' 'omarchy-menu-tmux-keybindings --print | less -R'" \
  "bind-key -N 'Show tmux keybindings' ? display-popup -E -w 80% -h 70% -T ' Tmux keybindings ' 'tmux list-keys -N | less -R'"
# Secondary binding for C-l to retain redraw
bind -N "Send literal C-l (redraw)" C-l send-keys 'C-l'
# more intuitive keybindings for splitting
bind -N "Split horizontally" '\' splitw -h -c "#{pane_current_path}"
bind -N "Split vertically" - splitw -v -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

# HACK: Karabiner coupled {{{
# left_command zoom on tap
bind -N "Zoom pane (mac: left_cmd tap)" -n M-Tab resize-pane -Z
# Omarchy Super-tap zoom: Alt+Tab (mac's M-Tab) is claimed by Hyprland's
# window-cycle bind, so keyd's Super tap sends M-z instead.
bind -N "Zoom pane (omarchy: super tap)" -n M-z resize-pane -Z
# jump to prev command (uses pure prompt ❯)
# tap git diff working (l_opt), staged (r_opt)
bind -N "Split: git diff (working)" -n M-C splitw -l 35% -h -c "#{pane_current_path}" 'git diff -- . ":(exclude)*.lock"; read'
bind -N "Split: git diff (staged)" -n M-C-c splitw -l 35% -h -c "#{pane_current_path}" 'git diff --cached  -- . ":(exclude)*.lock"; read'
# }}}

# Navigation {{{
# https://github.com/aserowy/tmux.nvim {{{
# Allow fzf to use c-[hijlk] keys
# https://blog.bugsnag.com/tmux-and-vim/
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -N "Focus pane left (vim-aware)" -n C-h run "($is_vim && tmux send-keys C-h) || \
                 tmux select-pane -L"
bind -N "Focus pane down (vim/fzf-aware)" -n C-j run "($is_vim && tmux send-keys C-j)  || \
                 ($is_fzf && tmux send-keys C-j) || \
                 tmux select-pane -D"
bind -N "Focus pane up (vim/fzf-aware)" -n C-k run "($is_vim && tmux send-keys C-k) || \
                 ($is_fzf && tmux send-keys C-k)  || \
                 tmux select-pane -U"
bind -N "Focus pane right (vim-aware)" -n C-l run "($is_vim && tmux send-keys C-l) || \
                 tmux select-pane -R"
bind-key -N "Focus pane left" -T copy-mode-vi 'C-h' select-pane -L
bind-key -N "Focus pane down" -T copy-mode-vi 'C-j' select-pane -D
bind-key -N "Focus pane up" -T copy-mode-vi 'C-k' select-pane -U
bind-key -N "Focus pane right" -T copy-mode-vi 'C-l' select-pane -R

# resize
bind -N "Resize pane left" -n M-a if-shell "$is_vim" 'send-keys left ' 'resize-pane -L 1'
bind -N "Resize pane right" -n M-d if-shell "$is_vim"  'send-keys right' 'resize-pane -R 1'
bind -N "Resize pane left" -n S-Left  if-shell "$is_vim" 'send-keys left ' 'resize-pane -L 1'
bind -N "Resize pane down" -n S-Down  if-shell "$is_vim" 'send-keys down ' 'resize-pane -D 1'
bind -N "Resize pane up" -n S-Up    if-shell "$is_vim" 'send-keys up   ' 'resize-pane -U 1'
bind -N "Resize pane right" -n S-Right if-shell "$is_vim" 'send-keys right' 'resize-pane -R 1'
bind-key -N "Resize pane left" -T copy-mode-vi S-Left  resize-pane -L 1
bind-key -N "Resize pane down" -T copy-mode-vi S-Down  resize-pane -D 1
bind-key -N "Resize pane up" -T copy-mode-vi S-Up    resize-pane -U 1
bind-key -N "Resize pane right" -T copy-mode-vi S-Right resize-pane -R 1

# my extras
bind -N "Focus vim runner / last pane" -n M-e if-shell "$is_vim" "send-keys ';VtrFocusRunner' Enter" "select-pane -l"
# save, repeat prev cmd, toggle between zoomed runner/dev buffer
bind -N "Save, re-run, focus runner" -n M-y if-shell "$is_vim" "send-keys ';w' Enter ';VtrSendCommandToRunner' Enter ';VtrFocusRunner' Enter" "select-pane -l \; resize-pane -Z"
# }}}

# fzf windows and panes inside popups
bind -N "Popup: fzf panes (all windows)" 0 display-popup -w 70% -h 70% -E "bash -ci ftpane"
# fzf pane from current window inside popup
bind -N "Popup: fzf panes (current window)" C-p display-popup -w 70% -h 70% -E "bash -ci ftcurrentpane"
# fzf windows inside popup
bind -N "Popup: fzf windows" C-f display-popup -w 70% -h 70% -E "ftwind"

bind -N "Previous window" -n M-j previous-window
bind -N "Next window" -n M-k next-window
bind -N "Last window" -n M-l last-window
bind -N "Last window" -n M-w last-window
bind -N "Last client" -n M-p switch-client -l
bind-key -N "Last pane" -n M-b select-pane -l
bind -N "Swap pane up" C-k swap-pane -U
# Easily swap a pane/window (targeted by pane number) with the current pane
bind-key -N "Swap window with…" w command-prompt -p "window #: "  "swap-window -t '%%'"

bind -N "Select window 1" -n M-1 select-window -t 1
bind -N "Select window 2" -n M-2 select-window -t 2
bind -N "Select window 3" -n M-3 select-window -t 3
bind -N "Select window 4" -n M-4 select-window -t 4
bind -N "Select window 5" -n M-5 select-window -t 5
bind -N "Select window 6" -n M-6 select-window -t 6
bind -N "Select window 7" -n M-7 select-window -t 7
bind -N "Select window 8" -n M-8 select-window -t 8
bind -N "Select window 9" -n M-9 select-window -t:9
bind -N "Select last window" -n M-0 select-window -t:$

# cycle pane
bind -N "Cycle to next pane" -n M-o select-pane -t :.+
bind -N "Select pane 1" 1 select-pane -t 0
bind -N "Select pane 2" 2 select-pane -t 1
bind -N "Select pane 3" 3 select-pane -t 2
bind -N "Select pane 4" 4 select-pane -t 3
bind -N "Select pane 5" 5 select-pane -t 4
bind -N "Select pane 6" 6 select-pane -t 5
bind -N "Select pane 7" 7 select-pane -t 6
bind -N "Select pane 8" 8 select-pane -t 7
bind -N "Select pane 9" 9 select-pane -t 8

bind -N "Layout: even horizontal" S-Left  select-layout even-horizontal
bind -N "Layout: main horizontal" S-Right select-layout main-horizontal
bind -N "Layout: even vertical" S-Down  select-layout even-vertical
bind -N "Layout: main vertical" S-Up    select-layout main-vertical
# revert layout
bind -N "Revert to previous layout" -n S-PageDown select-layout -o
# }}}

# Plugins {{{
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'irb pry "~rails server" "~rails console" ssh psql mysql sqlite3'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-unique 1
set -g @thumbs-contrast 0
set -g @thumbs-command "printf {} | clip"
set -g @thumbs-regexp-1 "`([^\`]*\s*[^\`]*)*`"

# tpm plugin manager path is pinned so both platforms install plugins to the
# same directory (otherwise tpm auto-selects XDG ~/.config/tmux/plugins on
# Linux, while this config's run line uses ~/.tmux/plugins).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
run '~/.tmux/plugins/tpm/tpm'
# }}}

# default discover list + omp (oh-my-pi fork) + ds4-agent, since @fleet_discover_agents
# replaces rather than extends. Not plain `ds4` (antirez's DwarfStar chat/inference CLI,
# no tool-use) — ds4-agent is the actual agentic coding harness (read/write/edit/bash/
# browse tools).
set -g @fleet_discover_agents "claude,codex,pi,gemini,amp,omp,ds4-agent"
# Default (3s) is shorter than the 5s pane-scrape interval that feeds it, so a
# single missed glyph-sample flips a still-working discovered agent to idle.
# 10s survives one full missed cycle plus jitter.
set -g @fleet_discover_idle_secs 10
# The three fleet-managed lines below deliberately carry no -N: fleet rewrites
# them, so any note added here would be dropped on its next run.
# Disabled: adds a second status-bar row rendering `fleet status
# --statusline` (agent state per pane). Turned off in favor of a plain
# single-row bar; `fleet statusline --remove` undid the live injection
# (status-format[1], the MouseDown1Status/MouseDown3Status root binds, and
# the pane-focus-in hook) the same day this was disabled here.
#
# To re-enable: uncomment and either restart tmux or run
# `fleet statusline --inject` once by hand, since editing tmux.conf alone
# doesn't retroactively touch an already-running server's options.
#
# Output redirected: the inject prints a confirmation to stdout while the
# config is being sourced, which lands in omarchy-menu-tmux-keybindings'
# parse and swallows the PREFIX header line. Verified status-format[1] is
# set identically with and without the redirect. fleet rewrites this line,
# so the redirect may need re-applying after a fleet update.
# run-shell "fleet statusline --inject >/dev/null 2>&1" # fleet-managed
bind-key f display-popup -E -w 80% -h 60% fleet # fleet-managed
bind -n M-f run-shell "fleet sidebar --from '#{pane_id}'" # fleet-managed
